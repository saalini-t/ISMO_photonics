name: Build & Release Flutter Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Unit & Widget Tests
        run: |
          cd mobile
          flutter test

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases Section
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Project Management System v1.0.0 (Android APK)"
          body: |
            ### 📱 Production Android APK Release
            - **App**: Full-Stack Project Management System
            - **Platform**: Android (Flutter Material 3)
            - **Backend**: Express REST API + PostgreSQL Database (Dockerized)
            - **Features**: User Auth, Projects CRUD, Tasks CRUD, Responsive Dashboard
            - **Built From Commit**: `${{ github.sha }}`
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
